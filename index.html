  <style>
    .click {
      cursor: pointer;
    }
    .red {
        color: red;
    }

    .buttontip {
      position: relative;
      display: inline-block;
      border-bottom: 1px dotted black;
    }

    .buttontip .buttontiptext {
      visibility: hidden;
      width: 200px;
      background-color: black;
      color: #fff;
      text-align: center;
      border-radius: 6px;
      padding: 5px 0;
      position: absolute;
      z-index: 1;
      top: 150%;
      left: 50%;
      margin-left: -100px;
    }

    .buttontip .buttontiptext::after {
      content: "";
      position: absolute;
      bottom: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: transparent transparent black transparent;
    }

    .buttontip:hover .buttontiptext {
      visibility: visible;
    }

    body {
      background: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    h1 {
      margin-bottom: 1.5rem;
      color: #343a40;
      text-align: center;
      font-weight: 700;
    }

    textarea {
      font-family: monospace;
      font-size: 0.95rem;
    }



    .card {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      background-color: #ffffff;
    }

    .btn-primary {
      background-color: #007bff;
      border: none;
      transition: background-color 0.3s;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    #results {
      margin-top: 1rem;
      padding: 1rem;
      background: #e9ecef;
      border-radius: 8px;
      min-height: 50px;
    }

    #relations-description {

      font-size: 0.95rem;
      color: #495057;
    }

    footer {

      padding-top: 1.2rem;
      border-top: 1px solid #dee2e6;
      text-align: center;
      color: #6c757d;
      font-size: 0.9rem;
    }

    footer a {
      color: #6c757d;
      font-weight: 500;
      transition: color 0.3s;
    }

    footer a:hover {

    }

    .authors {

    <div class="col-md-4">

        <select class="form-select" id="baza">
          <option value="facebookx_simple">Naloga 1-2</option>
          <option selected value="facebookx">Facebook & X</option>
          <option value="WikiLeaks">WikiLeaks</option>
          <option value="izpiti">Izpiti</option>

      </div>

    </div>

    <div class="col-md-8">
      <div id="operationButtons"></div>
      <textarea id="text" name="text" rows="4" cols="50" style="width: 100%"
                class="form-control" placeholder="Vnesite izraz relacijske algebre tukaj..."></textarea>
      <div class="d-grid gap-2">
        <button class="btn btn-primary" onclick="runEvaluation('#text', 0, 'results')">Evalviraj</button>
      </div>
      <div id="results">Rezultati bodo prikazani tukaj...</div>
    </div>
